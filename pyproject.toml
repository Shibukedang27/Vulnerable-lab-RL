[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnerable-lab-rl"
version = "0.1.0"
description = "Synthetic episodic environments for AI security evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Vulnerable-lab-RL contributors"}]
dependencies = []

[project.scripts]
vulnerable-lab-rl = "vulnerable_lab_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
